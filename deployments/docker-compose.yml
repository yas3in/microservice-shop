version: "3.8"

networks:
  microshop-net:
    driver: bridge
    internal: false # Allows gateway to communicate externally while keeping internal services isolated

volumes:
  postgres_data:
  redis_data:

services:
  # Internal Database - No host port exposure
  postgres:
    image: postgres:17.5-alpine3.22
    container_name: microshop-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-micro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-micro_pass}
      POSTGRES_DB: ${POSTGRES_DB:-microshop_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microshop-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-micro_user} -d ${POSTGRES_DB:-microshop_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Internal Cache - No host port exposure
  redis:
    image: redis:8.4-alpine
    container_name: microshop-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - microshop-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Internal Auth Microservice - No host port exposure
  auth-service:
    build:
      context: ..
      dockerfile: backend/auth_service/Dockerfile
    container_name: microshop-auth-service
    restart: always
    environment:
      - DEBUG=${DEBUG:-True}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://micro_user:micro_pass@postgres:5432/microshop_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microshop-net

  # Internal Catalogue Microservice - No host port exposure
  catalogue-service:
    build:
      context: ..
      dockerfile: backend/catalogue/Dockerfile
    container_name: microshop-catalogue-service
    restart: always
    environment:
      - DEBUG=${DEBUG:-True}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://micro_user:micro_pass@postgres:5432/microshop_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microshop-net

  # Public API Gateway - ONLY service exposing port 8000 to the outside world
  gateway:
    build:
      context: ..
      dockerfile: backend/gateway/Dockerfile
    container_name: microshop-gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - CATALOGUE_SERVICE_URL=http://catalogue-service:8002
    depends_on:
      - auth-service
      - catalogue-service
    networks:
      - microshop-net
